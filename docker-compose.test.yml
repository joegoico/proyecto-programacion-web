services:
  db_test:
    image: postgres:15
    container_name: gestor-notas-db-test
    environment:
      POSTGRES_USER: ${TEST_DB_USER:-testuser}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-testpassword}
      POSTGRES_DB: ${TEST_DB_NAME:-notas_db_test}
    ports:
      - "${TEST_DB_PORT:-5433}:5432"
    volumes:
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
