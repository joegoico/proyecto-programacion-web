services:
  db_test:
    image: postgres:15
    container_name: gestor-notas-db-test
    environment:
      POSTGRES_USER: ${TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD}
      POSTGRES_DB: ${TEST_DB_NAME}
    ports:
      - "${TEST_DB_PORT}:5432"
    volumes:
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
